name: Build bridge

# 构建桥：私有库 Actions 额度被账单拦住时，用公开仓库的免费额度构建。
#
# 这个文件刻意只做四件事：检出源码、装工具链、调用源码仓库里的构建入口、上传产物。
# 发版步骤的细节——用哪些脚本、什么顺序、运行时取哪个构建、怎么硬化怎么签名——全部在源码
# 仓库自己的构建脚本里，不写在这里：公开仓库的 workflow 不该把内部结构与发布流程摊开给人看。
# 要改构建步骤，改源码仓库那个入口脚本，不要往这个文件里加 run 块。
# 额度恢复后删除本文件。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支或标签'
        required: true
        default: 'main'
      promote_version:
        description: '转正后的正式版本号（如 3.13.0）；留空按 ref 自身版本构建'
        required: false
        default: ''
      delta_base:
        description: '增量基线版本（如 3.12.1）；留空按最近标签推断'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: bridge-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONIOENCODING: utf-8
      BRIDGE_REF: ${{ inputs.ref }}
      BRIDGE_PROMOTE_VERSION: ${{ inputs.promote_version }}
      BRIDGE_DELTA_BASE: ${{ inputs.delta_base }}
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    steps:
      # 源码仓库由仓库变量给出，不写死在这个文件里；只读部署密钥，日志与产物都不含源码。
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BRIDGE_SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bridge.ps1

      - name: Keep the build log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-test-log
          path: test.log
          retention-days: 7

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-out-${{ inputs.ref }}
          path: out/**
          retention-days: 7
